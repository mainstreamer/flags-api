services:
    php:
        build:
            context: ..
            dockerfile: .docker/php-fpm/Dockerfile
            target: development
            args:
                USER_ID: 1000
                GROUP_ID: 1000
        environment:
            APP_ENV: test
            DATABASE_URL: mysql://root:root@db:3306/flags_test?serverVersion=9.5
        volumes:
            - .:/var/www/html:rw,cached
        depends_on:
            db:
                condition: service_healthy
    db:
        build:
            context: ..
            dockerfile: .docker/mysql/Dockerfile
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: flags_test
        ports:
          - "33061:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 10

networks:
    default:
        name: flags-test-network
