# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    jwks_uri: '%env(JWKS_URI)%'
    app.version: '%env(default::APP_VERSION)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $botToken: '%env(string:BOT_TOKEN)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\Flags\:
        resource: '../src/Flags/*'
        exclude: '../src/Flags/{DependencyInjection,Entity,Migrations,Tests,Controller,Kernel.php}'

    # controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Flags\Controller\:
        resource: '../src/Flags/Controller'
        tags: ['controller.service_arguments']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\DataFixtures\:
        resource: '../src/DataFixtures/*'

    App\EventListener\NgrokHeaderListener:
      tags:
        - { name: kernel.event_subscriber }

    App\EventListener\JsonExceptionListener:
      arguments:
        $environment: '%kernel.environment%'
      tags:
        - { name: kernel.event_subscriber }

    App\EventListener\JwtAuthenticationFailureListener:
      tags:
        - { name: kernel.event_subscriber }

    App\Flags\Service\JwksService:
      arguments:
        $jwksUri: '%jwks_uri%'
        $projectDir: '%kernel.project_dir%'

    App\Flags\Security\JwksJwtEncoder: ~

    Lexik\Bundle\JWTAuthenticationBundle\Encoder\JWTEncoderInterface:
      alias: App\Flags\Security\JwksJwtEncoder


    ### REDIS START ###
    # 1. Define the Redis connection service
    # This represents the physical connection to your Redis container/server
    Redis:
      class: Redis
      calls:
        - method: connect
          arguments:
            - '%env(REDIS_HOST)%'
            - '%env(int:REDIS_PORT)%' # 'int:' ensures the port is passed as an integer

        # Uncomment if you added a password to your Redis K8s/Docker setup
        # - method: auth
        #   arguments:
        #       - '%env(REDIS_PASSWORD)%'

    # 2. Register the Session Handler
    # This tells Symfony how to use the Redis service above for sessions
    Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler:
      arguments:
        - '@Redis'
        # Optional: Add a prefix to avoid collisions with other apps using the same Redis
        - { prefix: 'flags_sess_', ttl: 3600 }
   ### REDIS END ###