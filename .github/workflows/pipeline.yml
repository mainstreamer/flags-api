name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PHP: ${{ github.repository }}-php
  IMAGE_NAME_CADDY: ${{ github.repository }}-caddy

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && !startsWith(github.ref, 'refs/tags/')
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      bump_type: ${{ steps.bump.outputs.bump_type }}

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate semantic version
        id: bump
        run: |
          # Get latest tag or default to v0.0.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Parse version numbers
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Get commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          # Determine bump type from commit message
          if echo "$COMMIT_MSG" | grep -qiE '\[major\]|BREAKING:|BREAKING CHANGE:'; then
            BUMP_TYPE="major"
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif echo "$COMMIT_MSG" | grep -qiE '\[minor\]|^feat:|^feat\('; then
            BUMP_TYPE="minor"
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            BUMP_TYPE="patch"
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bump type: $BUMP_TYPE"
          echo "New version: $NEW_VERSION"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

  check:
    runs-on: ubuntu-latest
    # Define the MySQL service
    services:
      mysql:
        image: mysql:9.5
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: symfony_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, gd, xml, mbstring, zip
          coverage: none

      - name: Setup test environment
        working-directory: app
        run: cp .env.test .env

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: app
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('app/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        working-directory: app
        run: composer install --prefer-dist --no-progress

      - name: Check Code Style
        working-directory: app
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Execute psalm
        working-directory: app
        run: vendor/bin/psalm

      - name: Create Database and Run Migrations
        working-directory: app
        env:
          # Use 127.0.0.1 for GitHub Actions services
          DATABASE_URL: mysql://root@127.0.0.1:3306/symfony_test?serverVersion=9.5
        run: |
          bin/console d:d:c -n --if-not-exists
          bin/console d:m:m -n -vvv
          bin/console app:populate:users 1 -f Test -l User
          bin/console app:populate:capitals -n --purge
          bin/console app:populate:flags -n --purge

      - name: Execute tests
        working-directory: app
        env:
          # Keep the same DATABASE_URL here
          DATABASE_URL: mysql://root@127.0.0.1:3306/symfony_test?serverVersion=9.5
        run: vendor/bin/phpunit

  tag:
    needs: [check, version]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.version.outputs.new_version }}" -m "Release v${{ needs.version.outputs.new_version }}"
          git push origin "v${{ needs.version.outputs.new_version }}"

  build:
    needs: [check, version, tag]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    permissions:
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract PHP metadata
        id: meta-php
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PHP }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ needs.version.outputs.new_version }}
            type=sha,prefix=,format=short

      - name: Extract Caddy metadata
        id: meta-caddy
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CADDY }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ needs.version.outputs.new_version }}
            type=sha,prefix=,format=short

      - name: Build and push PHP
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/php-fpm/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-php.outputs.tags }}
          labels: ${{ steps.meta-php.outputs.labels }}
          build-args: |
            SENTRY_RELEASE=${{ vars.SENTRY_PROJECT }}@${{ needs.version.outputs.new_version }}
          no-cache: true

      - name: Build and push Caddy
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/caddy/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-caddy.outputs.tags }}
          labels: ${{ steps.meta-caddy.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CADDY }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CADDY }}:buildcache,mode=max

      - name: Create Sentry release
        if: ${{ vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          VERSION="${{ vars.SENTRY_PROJECT }}@${{ needs.version.outputs.new_version }}"
          sentry-cli releases new "$VERSION"
          sentry-cli releases set-commits "$VERSION" --auto --ignore-missing
          sentry-cli releases finalize "$VERSION"
          sentry-cli releases deploys "$VERSION" new -e production

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      packages: write

    steps:
      - name: Delete old PHP container images
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ github.event.repository.name }}-php
          package-type: container
          min-versions-to-keep: 6
          delete-only-untagged-versions: false
          ignore-versions: '^(latest|v\\d+\\.\\d+\\.\\d+)$'

      - name: Delete old Caddy container images
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ github.event.repository.name }}-caddy
          package-type: container
          min-versions-to-keep: 6
          delete-only-untagged-versions: false
          ignore-versions: '^(latest|v\\d+\\.\\d+\\.\\d+)$'

  notify:
    needs: [check, build, version]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "${{ needs.check.result }}" == "failure" ] || [ "${{ needs.build.result }}" == "failure" ]; then
            COLOR=15158332  # Red
            STATUS="FAILED"
            EMOJI=":x:"
          else
            COLOR=3066993  # Green
            STATUS="SUCCESS"
            EMOJI=":white_check_mark:"
          fi

          # Build version info if available
          VERSION_INFO=""
          if [ -n "${{ needs.version.outputs.new_version }}" ]; then
            VERSION_INFO="\n**Version:** \`v${{ needs.version.outputs.new_version }}\` (${{ needs.version.outputs.bump_type }})"
          fi

          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$EMOJI ${{ github.repository }} - ${STATUS}\",
                \"description\": \"**Branch:** ${{ github.ref_name }}${VERSION_INFO}\n**Commit:** [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})\n**Author:** ${{ github.actor }}\",
                \"color\": ${COLOR},
                \"footer\": {
                  \"text\": \"GitHub Actions\"
                },
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" \
            $DISCORD_WEBHOOK
